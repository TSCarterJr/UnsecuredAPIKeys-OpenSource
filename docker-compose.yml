version: "3.9"

services:
  db:
    image: postgres:15
    container_name: unsecuredapikeys-db
    environment:
      POSTGRES_DB: UnsecuredAPIKeys
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d UnsecuredAPIKeys"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
